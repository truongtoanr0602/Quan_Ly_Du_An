<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">
<!-- Transactional Screen: Navigation Shell Suppressed -->
<main class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl p-8 shadow-sm">
<div class="text-center mb-8">
<h1 class="font-display-lg text-headline-md font-bold text-primary mb-2">ElectroTech</h1>
<h2 class="font-headline-lg text-headline-lg text-on-surface">Tạo tài khoản</h2>
<p class="font-body-md text-body-md text-secondary mt-2">Đăng ký để trải nghiệm dịch vụ của chúng tôi.</p>
</div>
<form class="space-y-6">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="fullname">Họ và tên</label>
<input class="w-full px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface" id="fullname" name="fullname" placeholder="Nguyễn Văn A" required="" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="email">Email</label>
<input class="w-full px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="phone">Số điện thoại</label>
<input class="w-full px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface" id="phone" name="phone" placeholder="0912345678" required="" type="tel"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="password">Mật khẩu</label>
<div class="relative">
<input class="w-full px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-secondary hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-lg" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="confirm_password">Xác nhận mật khẩu</label>
<div class="relative">
<input class="w-full px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface" id="confirm_password" name="confirm_password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-secondary hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-lg" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded" id="terms" name="terms" required="" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-secondary" for="terms">
                    Tôi đồng ý với <a class="text-primary hover:underline" href="#">Điều khoản dịch vụ</a> và <a class="text-primary hover:underline" href="#">Chính sách bảo mật</a>
</label>
</div>
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-3 rounded-lg hover:bg-primary/90 transition-colors shadow-sm hover:shadow-md flex justify-center items-center gap-2" type="submit">
                Đăng ký
                <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="mt-6 text-center">
<p class="font-body-md text-body-md text-secondary">
                Đã có tài khoản? 
                <a class="font-label-md text-label-md text-primary hover:underline ml-1 transition-all" href="/login">Đăng nhập ngay</a>
</p>
</div>
</main>
</body></html>
