<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Đăng ký - ElectroTech</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                            "surface-container-highest": "#e0e3e5",
                            "on-background": "#191c1e",
                            "inverse-primary": "#b4c5ff",
                            "secondary": "#505f76",
                            "surface": "#f7f9fb",
                            "background": "#f7f9fb",
                            "surface-container-high": "#e6e8ea",
                            "on-primary-fixed": "#00174b",
                            "inverse-surface": "#2d3133",
                            "on-tertiary-fixed-variant": "#783200",
                            "error": "#ba1a1a",
                            "surface-variant": "#e0e3e5",
                            "primary": "#004ac6",
                            "inverse-on-surface": "#eff1f3",
                            "error-container": "#ffdad6",
                            "on-surface-variant": "#434655",
                            "on-tertiary": "#ffffff",
                            "on-surface": "#191c1e",
                            "secondary-fixed": "#d3e4fe",
                            "on-secondary-fixed-variant": "#38485d",
                            "tertiary": "#8e3c00",
                            "on-secondary": "#ffffff",
                            "surface-tint": "#0053db",
                            "on-tertiary-fixed": "#341100",
                            "surface-container-lowest": "#ffffff",
                            "on-primary-fixed-variant": "#003ea8",
                            "primary-fixed-dim": "#b4c5ff",
                            "surface-container-low": "#f2f4f6",
                            "outline-variant": "#c3c6d7",
                            "on-primary-container": "#eeefff",
                            "surface-container": "#eceef0",
                            "tertiary-fixed": "#ffdbca",
                            "on-error-container": "#93000a",
                            "on-secondary-fixed": "#0b1c30",
                            "primary-container": "#2563eb",
                            "on-primary": "#ffffff",
                            "secondary-container": "#d0e1fb",
                            "surface-dim": "#d8dadc",
                            "secondary-fixed-dim": "#b7c8e1",
                            "on-secondary-container": "#54647a",
                            "primary-fixed": "#dbe1ff",
                            "surface-bright": "#f7f9fb",
                            "outline": "#737686",
                            "tertiary-container": "#b54e00",
                            "tertiary-fixed-dim": "#ffb690",
                            "on-tertiary-container": "#ffece5",
                            "on-error": "#ffffff"
                    },
                    "borderRadius": {
                            "DEFAULT": "0.125rem",
                            "lg": "0.25rem",
                            "xl": "0.5rem",
                            "full": "0.75rem"
                    },
                    "spacing": {
                            "margin-mobile": "16px",
                            "max-width": "1280px",
                            "unit": "4px",
                            "margin-desktop": "64px",
                            "gutter": "24px"
                    },
                    "fontFamily": {
                            "body-lg": ["Inter"],
                            "headline-lg": ["Inter"],
                            "body-md": ["Inter"],
                            "label-md": ["Inter"],
                            "spec-code": ["Inter"],
                            "headline-lg-mobile": ["Inter"],
                            "display-lg": ["Inter"],
                            "headline-md": ["Inter"]
                    },
                    "fontSize": {
                            "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                            "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                            "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                            "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                            "spec-code": ["13px", {"lineHeight": "18px", "fontWeight": "600"}],
                            "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                            "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                            "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">
<!-- Transactional Screen: Navigation Shell Suppressed -->
<main class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl p-8 shadow-sm">
<div class="text-center mb-8">
<h1 class="font-display-lg text-headline-md font-bold text-primary mb-2">ElectroTech</h1>
<h2 class="font-headline-lg text-headline-lg text-on-surface">Tạo tài khoản</h2>
<p class="font-body-md text-body-md text-secondary mt-2">Đăng ký để trải nghiệm dịch vụ của chúng tôi.</p>
</div>
<form class="space-y-6">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="fullname">Họ và tên</label>
<input class="w-full px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface" id="fullname" name="fullname" placeholder="Nguyễn Văn A" required="" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="email">Email</label>
<input class="w-full px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="phone">Số điện thoại</label>
<input class="w-full px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface" id="phone" name="phone" placeholder="0912345678" required="" type="tel"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="password">Mật khẩu</label>
<div class="relative">
<input class="w-full px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-secondary hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-lg" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="confirm_password">Xác nhận mật khẩu</label>
<div class="relative">
<input class="w-full px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface" id="confirm_password" name="confirm_password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-secondary hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-lg" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded" id="terms" name="terms" required="" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-secondary" for="terms">
                    Tôi đồng ý với <a class="text-primary hover:underline" href="#">Điều khoản dịch vụ</a> và <a class="text-primary hover:underline" href="#">Chính sách bảo mật</a>
</label>
</div>
<button class="w-full bg-[#f97316] text-white font-label-md text-label-md py-3 rounded hover:bg-[#ea580c] transition-colors shadow-sm hover:shadow-md flex justify-center items-center gap-2" type="submit">
                Đăng ký
                <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="mt-6 text-center">
<p class="font-body-md text-body-md text-secondary">
                Đã có tài khoản? 
                <a class="font-label-md text-label-md text-primary hover:underline ml-1 transition-all" href="/login">Đăng nhập ngay</a>
</p>
</div>
</main>
</body></html>
